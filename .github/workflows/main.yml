name: Build and Publish HEY.SSK APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct complete HEY.SSK project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          root = Path(".github/heys_parts")
          alpha = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"

          targets = {
              "02": "257d5cd1caa4c2e75107fb68a94c610ed4294619228df20bbcd03a286f7073f3",
              "08": "592b87c49205e67c2522c4c35fc841c19529b3e03e2bbca66d95627f9031850c",
          }

          for part, target in targets.items():
              path = root / f"part{part}.b64"
              s = path.read_text().strip()
              if len(s) == 8000:
                  continue
              if len(s) != 7999:
                  raise SystemExit(f"Unexpected chunk length for part{part}: {len(s)}")

              found = None
              for pos in range(len(s) + 1):
                  for ch in alpha:
                      candidate = s[:pos] + ch + s[pos:]
                      raw = base64.b64decode(candidate)
                      if hashlib.sha256(raw).hexdigest() == target:
                          found = candidate
                          break
                  if found is not None:
                      break

              if found is None:
                  raise SystemExit(f"Could not repair part{part}")
              path.write_text(found)
              print(f"Repaired part{part}")

          chunks = "".join((root / f"part{i:02d}.b64").read_text().strip() for i in range(1, 11)) + "".join((root / "p11" / name).read_text().strip() for name in ["01.b64", "02.b64", "03.b64"])
          raw = base64.b64decode(chunks, validate=True)
          if hashlib.sha256(raw).hexdigest() != "16cde638f9af3c200d63de860241e2ca7f565c5bf27a6d9db814c2c7ecb45e25":
              raise SystemExit("Final ZIP checksum mismatch")
          Path("/tmp/HEY_SSK.zip").write_bytes(raw)
          print(f"Verified ZIP: {len(raw)} bytes")
          PY

          rm -rf /tmp/heys
          mkdir -p /tmp/heys
          unzip -q /tmp/HEY_SSK.zip -d /tmp/heys
          cp -R /tmp/heys/HEY_SSK/. .
          rm -rf /tmp/heys /tmp/HEY_SSK.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HEY-SSK-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
