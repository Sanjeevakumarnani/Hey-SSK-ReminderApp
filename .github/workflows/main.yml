name: Build and Publish HEY.SSK APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand the complete project into the repository root
        shell: bash
        run: |
          if [ -f HeySSK.zip ]; then
            rm -rf /tmp/heys
            mkdir -p /tmp/heys
            unzip -q HeySSK.zip -d /tmp/heys
            cp -R /tmp/heys/HEY_SSK/. .
            rm -rf /tmp/heys HeySSK.zip
          fi

      - name: Commit expanded source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Expand complete HEY.SSK Android project"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HEY-SSK-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
