name: Build and Publish HEY.SSK APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct complete HEY.SSK project
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/HEY_SSK.zip
          cat .github/heys_parts/part*.b64 > /tmp/HEY_SSK.b64
          base64 -d /tmp/HEY_SSK.b64 > /tmp/HEY_SSK.zip
          rm -rf /tmp/heys
          mkdir -p /tmp/heys
          unzip -q /tmp/HEY_SSK.zip -d /tmp/heys
          cp -R /tmp/heys/HEY_SSK/. .
          rm -rf /tmp/heys /tmp/HEY_SSK.zip /tmp/HEY_SSK.b64

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HEY-SSK-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
